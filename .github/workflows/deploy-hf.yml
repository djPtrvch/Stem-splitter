# Публикует проект в Hugging Face Space при каждом push.
# Нужно в настройках репозитория (Settings → Secrets and variables → Actions):
#   секрет  HF_TOKEN  — токен Hugging Face с правом записи
#   переменная HF_SPACE — имя Space, например  username/stem-splitter
name: Deploy to Hugging Face
on:
  push:
    branches: [main, claude/nice-ptolemy-i2vz94]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then echo "::notice::HF_TOKEN/HF_SPACE не заданы — публикация пропущена"; exit 0; fi
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
