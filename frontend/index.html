<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stem Splitter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Stem Splitter</h1>

  <section id="upload" class="card">
    <label id="drop" for="file">
      <input type="file" id="file" accept="audio/*,video/*,.mkv,.mov,.webm,.mp3,.wav,.flac,.ogg,.m4a,.aac,.opus,.aiff">
      <span id="drop-text">Перетащите трек или видео сюда или нажмите, чтобы выбрать</span>
    </label>
    <div class="row">
      <label>Модель <select id="model"></select></label>
      <button id="start" disabled>Разделить</button>
    </div>
  </section>

  <section id="progress" class="card hidden">
    <div id="status">Загрузка…</div>
    <div class="bar"><div id="bar-fill"></div></div>
  </section>

  <section id="result" class="card hidden">
    <div class="row head">
      <h2 id="track-name"></h2>
      <button id="new" class="ghost">Новый трек</button>
    </div>
    <video id="video" class="hidden" muted playsinline></video>
    <div class="transport">
      <button id="play" class="icon big" disabled title="Воспроизвести все (пробел)"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg></button>
      <span id="time">0:00 / 0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" disabled>
    </div>
    <div id="stems"></div>
    <p class="hint">▶ у стема — слушать только его · 🔈 — выключить стем · 🎧 — соло · нажмите на волну, чтобы перемотать</p>
    <div class="row export">
      <label>Формат <select id="format"></select></label>
      <button id="zip">Скачать все стемы (ZIP)</button>
      <button id="audio-dl" class="ghost">Скачать исходный звук</button>
      <button id="video-dl" class="hidden" title="Видео со звуком из включённых стемов (учитывает выключенные, соло и громкость)">Скачать видео с текущим миксом</button>
    </div>
  </section>

  <p id="error" class="error hidden"></p>
</main>
<script src="app.js"></script>
</body>
</html>
